nvt-power-line-type-nickel=使输电线呈现镍丝般有光泽的蓝灰色。
nvt-power-line-type-aluminum=使输电线呈现铝丝般的黄色。
nvt-power-line-type-copper=使输电线呈现原版默认的铜色。
nvt-power-line-type-gray=使输电线呈现模组初版的经典灰色。

