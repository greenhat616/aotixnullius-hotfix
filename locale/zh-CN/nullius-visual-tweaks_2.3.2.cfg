nvt-broken-air-filter=从探测器上打捞的受损气体过滤装置。外壳凹陷破裂。
nvt-broken-hydro-plant=从探测器上打捞的受损液体过滤装置。内部管道破裂泄漏。
nvt-broken-electrolyzer=从探测器上打捞的受损电解装置。电极缺失或损毁。
nvt-broken-chemical-plant=从探测器上打捞的受损化学反应器。控制阀缺失或损毁。
nvt-broken-foundry=从探测器上打捞的受损冶金坩埚。加热室内壁开裂缺损。
