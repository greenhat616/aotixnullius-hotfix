nvt-oxygen=高活性的氧族气体。储量丰富，但由于其活性，不常以双原子形式存在。可促进高能量的燃烧反应。它也碰巧在有氧细胞呼吸过程中至关重要。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] O[font=default-tiny-bold]2[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
