nvt-pisciculture-drone=鱼类养殖无人机

[fluid-description]
nvt-water=化学纯的液态水。极性无机化合物，是极性分子的溶剂，涵盖了生物体大部分的碳基化学。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] H[font=default-tiny-bold]2[/font]O  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（[item=nullius-outfall-2]）
nvt-seawater=从大型地表水体中抽取的不纯的水。含有溶解的卤化物和其他矿物杂质。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 水溶液（稀释）（[item=nullius-outfall-2]）
nvt-freshwater=从行星地表深处的含水层抽取的不纯的水。基本不含溶解的卤化物，但仍含有矿物杂质。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 水溶液（稀释）（[item=nullius-outfall-2]）
nvt-saline=盐溶于纯水形成的溶液。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] NaCl·H[font=default-tiny-bold]2[/font]O  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 水溶液（稀释）（[item=nullius-outfall-2]）
nvt-brine=盐在纯水中的高浓度溶液。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] NaCl·H[font=default-tiny-bold]2[/font]O  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 水溶液（浓缩）（[item=nullius-outfall-2]）
nvt-heavy-water=密度更大的水变体，因其氢以氘（[fluid=nullius-deuterium]）的形式存在。含有微量的氚（[fluid=nullius-tritium]）。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] D[font=default-tiny-bold]2[/font]O  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（[item=nullius-outfall-2]）
nvt-wastewater=含有高浓度化学副产物和溶解沉积物的水溶液。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 水溶液（[item=nullius-outfall-2]）
nvt-sludge=由化学废物、矿物和水组成的浓稠浆液。是各种工业过程的产物。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 水溶液（浓缩）（1步清空）
nvt-effluent=源自生物过程的水态废物，富含磷酸盐、氨和微量矿物质。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 水溶液（2步清空）
nvt-steam=水的气态形式。含有大量热能。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] H[font=default-tiny-bold]2[/font]O  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）\n[font=default-semibold][color=1,0.9,0.75]涡轮能量：[/color][/font] 6kJ\n[font=default-semibold][color=1,0.9,0.75]封闭式涡轮回收：[/color][/font] 每6份[fluid=nullius-steam]得1份水[fluid=nullius-water]
nvt-pressure-steam=压缩的过热水蒸气，处于超临界状态。含有极高的热能。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] H[font=default-tiny-bold]2[/font]O  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 超临界（1步清空）\n[font=default-semibold][color=1,0.9,0.75]涡轮能量：[/color][/font] 20kJ\n[font=default-semibold][color=1,0.9,0.75]封闭式涡轮回收：[/color][/font] 每2份[fluid=nullius-pressure-steam]得1份水[fluid=nullius-water]
nvt-air=行星大气。各种气体较为均匀的混合物。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
nvt-residual-gas=最常见的气体经蒸馏分离后剩余的大气混合物。氩的浓度较高。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
nvt-trace-gas=其他气体经蒸馏分离后剩余的极稀有大气混合物。氦的浓度较高。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
nvt-volcanic-gas=通过活跃的火山活动从行星深处散发出的气态产物。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
nvt-nitrogen=常见的氮族气体，双原子形态下相对不活泼。构成了行星大气的绝大部分。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] N[font=default-tiny-bold]2[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
nvt-argon=相对丰富的惰性稀有气体，源自行星地壳中的放射性同位素衰变。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] Ar  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
nvt-helium=极轻的惰性稀有气体。尽管在宇宙中储量丰富，但由于容易逃逸到太空中，氦在类地行星上相当稀有。其浓度通过地壳深处重元素的放射性同位素衰变得到补充。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] He  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
nvt-carbon-dioxide=大气温室气体，也是丰富的碳源。是燃烧等各种化学过程的常见产物。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] CO[font=default-tiny-bold]2[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
nvt-carbon-monoxide=活性气体，是缺氧环境中不完全燃烧的常见副产物。也可通过地质过程自然产生。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] CO  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
nvt-methane=最简单的烷烃，可燃气体。强效温室气体。可通过蛇纹石化等地质过程少量形成。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] CH[font=default-tiny-bold]4[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
nvt-ethylene=最简单的烯烃，可燃气体。塑料聚合物和其他烃类化合物的前体。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] C[font=default-tiny-bold]2[/font]H[font=default-tiny-bold]4[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（1步清空）
nvt-propene=第二简单的烯烃，可燃气体。各种化合物的前体。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] C[font=default-tiny-bold]3[/font]H[font=default-tiny-bold]6[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（1步清空）
nvt-benzene=可燃的液态烃。其他化合物的前体，也可作燃料添加剂。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] C[font=default-tiny-bold]6[/font]H[font=default-tiny-bold]6[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（1步清空）
nvt-methanol=最简单的脂肪醇。易挥发、可燃、能量密度高，既可作液体燃料也可作溶剂。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] CH[font=default-tiny-bold]3[/font]OH  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（[item=nullius-outfall-2]）
nvt-butadiene=最简单的共轭二烯。合成橡胶的前体。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] C[font=default-tiny-bold]4[/font]H[font=default-tiny-bold]6[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（无法清空）
nvt-styrene=由苯生产的油状液体，用作合成橡胶的共聚单体。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] C[font=default-tiny-bold]8[/font]H[font=default-tiny-bold]8[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（无法清空）
nvt-acrylonitrile=挥发性液体单体，用于合成橡胶和纤维。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] C[font=default-tiny-bold]3[/font]H[font=default-tiny-bold]3[/font]N  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（无法清空）
nvt-ech=环氧氯丙烷。高活性的有机氯环氧化合物，用于生产甘油和环氧树脂。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] C[font=default-tiny-bold]3[/font]H[font=default-tiny-bold]5[/font]ClO  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（2*步清空）
nvt-glycerol=粘稠的多元醇，是生产生物活性有机化合物的中间体。其硝酸盐具有极强的爆炸性。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] C[font=default-tiny-bold]3[/font]H[font=default-tiny-bold]8[/font]O[font=default-tiny-bold]3[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（1*步清空）
nvt-diesel=调配而成的高能量密度液态烃燃料。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（1步清空）
nvt-solvent=多用途的有机溶剂混合物，用于溶解非极性分子。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（无法清空）
nvt-epoxy=液态环氧化合物，固化后形成坚硬、耐用、轻质的聚合物，用于覆盖表面和密封缝隙。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（无法清空）
nvt-refrigerant=诺氟烷。性质稳定的卤代烷，其热力学特性非常适合利用汽化潜热。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] C[font=default-tiny-bold]2[/font]H[font=default-tiny-bold]2[/font]F[font=default-tiny-bold]4[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（无法清空）
