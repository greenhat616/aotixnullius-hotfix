nvt-broken-pylon=从探测器上打捞的受损电力传输装置。支撑框架弯曲断裂。
nvt-broken-solar-panel=从探测器上打捞的受损太阳能阵列。光伏电池划伤，需要抛光。
nvt-broken-grid-battery=从探测器上打捞的受损储能设备。电极涂层磨损，需要更换。
nvt-broken-sensor-node=从探测器上打捞的受损信号扫描器。发射器元件烧毁，需要更换。
