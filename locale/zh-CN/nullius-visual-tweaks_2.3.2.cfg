[mod-setting-description]
nvt-power-line-type=更改输电线的颜色，以匹配不同的材质。
nvt-change-toolbar-wire-icon=启用后，根据所选的线材类型，将铜线快捷栏图标替换为相应颜色的线材，并使用通用名称「电线」。
nvt-electric-furnaces=启用后，将小型熔炉1型、小型熔炉2型和中型熔炉1型改为使用电炉贴图和音效，取代原版的燃烧炉贴图和音效。
nvt-nauvis-space-description=启用后，将新地星的游戏内描述改为符合游戏开局条件的版本。完成目标之后，欢迎取消勾选，作为最后的点缀 :)。
nvt-cliff-explosives-fix=启用后，修复投掷出的炸药仍然显示为蓝色的问题——它已不再是悬崖炸药。
nvt-factoriopedia-patches=启用后，整理未分类的条目，隐藏多余条目，并修复图鉴中显示的错误配方图标和本地化文本。
nvt-voiding-icons=启用后，将清空配方的图标替换为个人认为更赏心悦目的 X 图标。
nvt-item-sounds=启用后，将「无主之地」添加的许多物品的拾取/放下音效从通用音效替换为更贴合的音效，灵感取自原版游戏。
nvt-item-descriptions=启用后，为所有适用的物品添加新的描述、化学式和物态信息。
nvt-chimneys=启用后，将烟囱1型、烟囱2型和烟囱3型的贴图替换为新贴图。
nvt-outfalls=启用后，将排水口1型、排水口2型和排水口3型的贴图替换为新贴图。
nvt-valves=启用后，将单向阀的贴图替换为新贴图。
nvt-small-pumps=启用后，将小型泵1型和小型泵2型的贴图替换为新贴图。
nvt-air-filters=启用后，将空气过滤器1型、空气过滤器2型和空气过滤器3型的贴图替换为新贴图。
nvt-tier-0-color=应用于「0级」建筑的蒙版颜色，其配方在机械学研究之前解锁。
nvt-tier-1-color=应用于「1级」建筑的蒙版颜色，其配方随机械学研究解锁。
nvt-tier-2-color=应用于「2级」建筑的蒙版颜色，其配方随电气工程研究解锁。
nvt-tier-3-color=应用于「3级」建筑的蒙版颜色，其配方随化学/物理学研究解锁。
nvt-tier-4-color=应用于「4级」建筑的蒙版颜色，其配方随物理学/生物学研究解锁。
nvt-tier-5-color=应用于「5级」建筑的蒙版颜色，其配方随天文学研究解锁。

