nvt-photosensitizer=吸光化合物，在电磁辐射照射下可促进光化学反应。\n[font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 液体（无法清空）
nvt-hydrogen=最轻、储量最丰富的化学元素，以双原子气体形式存在。化学性质活泼且可燃，可用作燃料和多种化学过程。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] H[font=default-tiny-bold]2[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
nvt-deuterium=稀有的较重氢稳定同位素，在宇宙早期与其他氢同位素一同形成。在行星上通常取自天然水圈中存在的重水。\n[font=default-semibold][color=1,0.9,0.75]分子式：[/color][/font] D[font=default-tiny-bold]2[/font]  [font=default-semibold][color=1,0.9,0.75]状态：[/color][/font] 气体（[item=nullius-chimney-2]）
