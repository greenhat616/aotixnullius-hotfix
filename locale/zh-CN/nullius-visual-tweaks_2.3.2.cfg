[entity-description]
nvt-nauvis-description=一颗岩石行星，拥有咸水海洋和含有二氧化碳与氮气的大气层。富含铁的矿物和铝土矿矿床，以及砂石和方解石岩层点缀着地貌。地质活动活跃的边界处存在着活跃的喷气孔。
nvt-nauvis-description-lambent-nil=一颗岩石行星，拥有咸水海洋和含有二氧化碳与氮气的大气层。富含铁的矿物和铝土矿矿床，以及砂石、方解石和较稀有的富磷矿土壤点缀着地貌。地质活动活跃的边界处存在着活跃的喷气孔。
nvt-nauvis-description-tricky-old-nick=一颗岩石行星，拥有咸水海洋和含有二氧化碳与氮气的大气层。富含铁、镍的矿物和铝土矿矿床，以及砂石、方解石和较稀有的富磷矿土壤点缀着地貌。地质活动活跃的边界处存在着活跃的喷气孔。

