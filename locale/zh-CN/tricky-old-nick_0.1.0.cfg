#翻译：aotix


[mod-name]
tricky-old-nick=无主之镍

[mod-description]
tricky-old-nick=[color=green]Tricky Old Nick[/color]\n此模组又名「狡猾老镍」。\n在此「无主之地」扩展中，稀有金属镍作为一种易于提炼的导电且耐腐蚀的材料，支撑着生产，从机器人开始改造这颗星球。随着技术进步，镍被铝和钢取代；然而，由于其独特的磁性、耐热性和化学性质，它仍然是小众应用中的必需品。此模组让游戏前期更具挑战性。推荐给喜欢玩多样矿物或者从头体验新鲜挑战的玩家。

