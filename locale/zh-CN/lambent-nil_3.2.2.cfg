[mod-description]
lambent-nil=[color=green]Lambent Nil[/color]\n此模组又名「从磷开始」。\n「无主之地」的扩展模组，继承了磷化学并扩展了电子生产链。磷是从磷矿中提炼出来的，用于电子和生物化学。

